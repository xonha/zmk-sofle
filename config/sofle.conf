# Uncomment the following line to enable the Sofle OLED Display
# CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_POINTING=y

# Uncomment these two lines to add support for encoders
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Bluetooth config
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# Low-frequency clock source: use the external 32.768kHz crystal (more precise
# than the internal RC -> steadier BLE timing between halves).
# NOTE: only works if the board actually has a crystal. If a half fails to boot
# or BLE gets worse, revert to: CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=y

# Force 1M PHY (more robust to interference than 2M at short range).
CONFIG_BT_CTLR_PHY_2M=n

# No battery on this build (both halves are USB-powered), so disable battery
# reporting -> no bogus battery level and less pointless BLE traffic.
CONFIG_ZMK_BATTERY_REPORTING=n

# Uncomment this line below to add rgb underglow / backlight support
# CONFIG_ZMK_RGB_UNDERGLOW=y

# Uncomment the line below to disable external power toggling by the underglow.
# By default toggling the underglow on and off also toggles external power
# on and off. This also causes the display to turn off.
# CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n
